name: accounting_app
description: 个人记账应用 - 语音记账 + 拍照记账
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # 状态管理
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # 网络
  dio: ^5.4.0

  # 本地存储
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # UI组件
  fl_chart: ^0.66.0
  flutter_slidable: ^3.0.1

  # 媒体
  image_picker: ^1.0.7
  record: ^5.0.4
  audioplayers: ^5.2.1
  permission_handler: ^11.2.0
  
  # 定位
  location: ^5.0.3

  # 工具
  intl: ^0.18.1
  path_provider: ^2.1.2
  crypto: ^3.0.3
  file_picker: ^6.1.1
  csv: ^5.1.1

  # 版本更新
  package_info_plus: ^5.0.1
  open_filex: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.8
  hive_generator: ^2.0.1
  riverpod_generator: ^2.3.9

flutter:
  uses-material-design: true
